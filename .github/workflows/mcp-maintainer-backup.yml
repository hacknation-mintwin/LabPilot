name: MCP Server Maintainer (Backup)

on:
  workflow_dispatch:
    inputs:
      started_at_iso:
        description: "Campaign start time in ISO-8601 (optional for manual runs)"
        required: false
        type: string
      duration_hours:
        description: "Campaign duration in hours"
        required: false
        default: "24"
        type: string
      force_failure:
        description: "Force a failure to validate backup repair path"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: mcp-maintainer-backup
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      DEFAULT_DURATION_HOURS: "24"
      SOURCE_FEATURE_BRANCH: "feature/experiment-similarity-onepager"
      TARGET_BRANCH: "mcp-server"
      CAMPAIGN_STARTED_AT: ${{ vars.MCP_MAINTAINER_STARTED_AT }}
      CAMPAIGN_DURATION_HOURS: ${{ vars.MCP_MAINTAINER_DURATION_HOURS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve campaign window
        id: campaign
        shell: bash
        run: |
          set -euo pipefail
          STARTED_INPUT="${{ inputs.started_at_iso }}"
          DURATION_INPUT="${{ inputs.duration_hours }}"
          EVENT="${{ github.event_name }}"

          STARTED_AT="${STARTED_INPUT:-${CAMPAIGN_STARTED_AT:-}}"
          if [[ -z "${STARTED_AT}" ]]; then
            if [[ "${EVENT}" == "workflow_dispatch" ]]; then
              STARTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            else
              echo "active=false" >> "$GITHUB_OUTPUT"
              echo "reason=no_campaign_start_configured" >> "$GITHUB_OUTPUT"
              echo "campaign_started_at=" >> "$GITHUB_OUTPUT"
              echo "duration_hours=${CAMPAIGN_DURATION_HOURS:-${DEFAULT_DURATION_HOURS}}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          DURATION_HOURS="${DURATION_INPUT:-${CAMPAIGN_DURATION_HOURS:-${DEFAULT_DURATION_HOURS}}}"
          if ! [[ "$DURATION_HOURS" =~ ^[0-9]+$ ]]; then
            echo "Duration must be an integer hour count." >&2
            exit 1
          fi

          START_EPOCH="$(date -u -d "$STARTED_AT" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          DEADLINE_EPOCH=$((START_EPOCH + (DURATION_HOURS * 3600)))

          if (( NOW_EPOCH > DEADLINE_EPOCH )); then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "reason=campaign_window_elapsed" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "reason=campaign_window_open" >> "$GITHUB_OUTPUT"
          fi

          echo "campaign_started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
          echo "duration_hours=${DURATION_HOURS}" >> "$GITHUB_OUTPUT"

      - name: Exit when campaign is inactive
        if: steps.campaign.outputs.active != 'true'
        run: |
          echo "Skipping run. Reason: ${{ steps.campaign.outputs.reason }}"
          exit 0

      - name: Resolve source branch with fallback
        id: source_branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          if git show-ref --verify --quiet "refs/remotes/origin/${SOURCE_FEATURE_BRANCH}"; then
            SOURCE="${SOURCE_FEATURE_BRANCH}"
          else
            SOURCE="main"
          fi
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "Resolved source branch: ${SOURCE}"

      - name: Ensure target branch exists
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ steps.source_branch.outputs.source }}"
          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -B "${TARGET_BRANCH}" "origin/${SOURCE}"
            git push -u origin "${TARGET_BRANCH}"
          fi

      - name: Sync source changes into target branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ steps.source_branch.outputs.source }}"
          git fetch origin "${SOURCE}" "${TARGET_BRANCH}"
          git merge --no-edit --no-ff "origin/${SOURCE}"
          echo "sync_ok=true" >> "$GITHUB_OUTPUT"

      - name: Install MCP dependencies
        run: npm --prefix ./mcp-server install

      - name: Run MCP tests
        run: npm --prefix ./mcp-server test

      - name: Optionally force failure
        if: ${{ inputs.force_failure }}
        run: |
          echo "Forced failure requested for backup repair-path test."
          exit 1

      - name: Push target branch
        if: success()
        run: git push origin "${TARGET_BRANCH}"

      - name: Create or update PR into source branch
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: mcp-server
          base: ${{ steps.source_branch.outputs.source }}
          title: "chore: keep mcp-server in sync with source branch (backup)"
          commit-message: "chore: sync mcp-server with source branch (backup)"
          body: |
            ## Summary
            - Syncs `mcp-server` with `${{ steps.source_branch.outputs.source }}`
            - Keeps MCP server implementation and tests current
            - Created automatically by backup maintainer workflow

            ## Verification
            - `npm --prefix ./mcp-server test`
          labels: |
            automation
            mcp-server
            backup-maintainer

      - name: Create backup repair context
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/mcp-maintainer
          cat > .github/mcp-maintainer/failure-state-backup.json <<EOF
          {
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "sourceBranch": "${{ steps.source_branch.outputs.source }}",
            "targetBranch": "${TARGET_BRANCH}",
            "reason": "sync_or_test_failure_backup",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Open or update backup repair-request PR
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: mcp-server-repair-backup
          base: ${{ steps.source_branch.outputs.source }}
          title: "chore: mcp maintainer backup repair request"
          commit-message: "chore: add backup mcp maintainer failure context"
          add-paths: |
            .github/mcp-maintainer/failure-state-backup.json
          body: |
            ## Automated Backup Repair Request
            The backup maintainer workflow hit a sync/test failure.

            - Run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            - Source branch: `${{ steps.source_branch.outputs.source }}`
            - Target branch: `mcp-server`
          labels: |
            automation
            mcp-server
            repair-request
            backup-maintainer

      - name: Save run status artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          jq -n \
            --arg event "${{ github.event_name }}" \
            --arg source "${{ steps.source_branch.outputs.source }}" \
            --arg target "${TARGET_BRANCH}" \
            --arg active "${{ steps.campaign.outputs.active }}" \
            --arg reason "${{ steps.campaign.outputs.reason }}" \
            --arg startedAt "${{ steps.campaign.outputs.campaign_started_at }}" \
            --arg duration "${{ steps.campaign.outputs.duration_hours }}" \
            --arg result "${{ job.status }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              event: $event,
              sourceBranch: $source,
              targetBranch: $target,
              campaign: {
                active: $active,
                reason: $reason,
                startedAt: $startedAt,
                durationHours: $duration
              },
              result: $result,
              runUrl: $runUrl
            }' > .artifacts/mcp-maintainer-backup-status.json

      - name: Upload run status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-maintainer-backup-status-${{ github.run_id }}
          path: .artifacts/mcp-maintainer-backup-status.json
